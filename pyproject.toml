[project]
name = "restaurant-forecasting"
version = "0.1.0"
description = "Restaurant demand forecasting for EatClub"
requires-python = ">=3.12"

# dependencies needed during production
dependencies = [ 
    "pandas==2.3.0",
    "scikit-learn==1.7.0",
    "lightgbm==4.6.0",
    "mlflow==3.1.1",
    "pydantic==2.11.7",
    "pyyaml==6.0.2",
    "loguru==0.7.3",
    "numpy==1.26.4",
]

# dependencies needed during development in local machine
[project.optional-dependencies]
dev = [
    "databricks-connect==16.3.5",
    "ipykernel",
    "pre-commit",
    "pip",
    "python-dotenv",
]

# essential for building the package and creating a wheel file
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]

# pointing to the modular code directory for packaging
packages = ["src/restaurant_forecasting"]